name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'debug'
          - 'test_only'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          grep -q "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || \
            printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" >> "$SDK_ROOT/licenses/android-sdk-license"
          grep -q "84831b9409646a918e30573bab4c9c91346d8abd" "$SDK_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || \
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" >> "$SDK_ROOT/licenses/android-sdk-preview-license"
          grep -q "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" "$SDK_ROOT/licenses/google-gdk-license" 2>/dev/null || \
            printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" >> "$SDK_ROOT/licenses/google-gdk-license"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            $(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1); do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "cmdline-tools;latest" || echo "Warning: cmdline-tools;latest update returned non-zero"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          for pkg in "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1"; do
            echo "Installing SDK package: $pkg"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$pkg" || echo "Warning: failed installing $pkg"
          done

          echo "Installed platforms:"
          ls -la "$SDK_ROOT/platforms" || true
          echo "Installed build-tools:"
          ls -la "$SDK_ROOT/build-tools" || true

          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            echo "::error::Required SDK platform android-36.1 was not installed under $SDK_ROOT/platforms"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed || true
            exit 1
          fi

          if [ -d "$SDK_ROOT/platform-tools" ]; then
            echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          fi

      - name: Setup Environment Files (.env)
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
            echo "Decoded debug.keystore from base64"
          fi

          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      - name: Ensure Executable Permissions
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Run Unit Tests & Verifications
        run: |
          if [ -f gradlew ]; then
            ./gradlew testDebugUnitTest --stacktrace --continue -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          else
            gradle testDebugUnitTest --stacktrace --continue -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          fi

      - name: Run Android Lint
        if: ${{ github.event.inputs.build_type != 'test_only' }}
        continue-on-error: true
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:lintDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" || true
          else
            gradle :app:lintDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" || true
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'test_only' }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          else
            gradle assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          fi

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type != 'test_only' }}
        uses: actions/upload-artifact@v6
        with:
          name: OmniView-RTSP-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
